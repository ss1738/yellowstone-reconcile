[package]
name = "reconcile-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Browser replay of yellowstone-reconcile fixtures, compiled from the library itself"
publish = false

# A separate crate: it is not part of the library's package, tests or source manifest.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
yellowstone-reconcile = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
