name: Verify on the maintainer's build machine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, ironman]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: test "$(hostname | tr '[:upper:]' '[:lower:]' | cut -d. -f1)" = ironman
      - run: bash scripts/verify.sh
