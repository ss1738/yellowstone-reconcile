name: Reproducible failure
description: Report an incorrect agreement decision, recovery failure or integration error.
body:
  - type: textarea
    id: version
    attributes:
      label: Revision and configuration
      description: Commit, enabled features, toolchain and relevant limits. Omit credentials and endpoint URLs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A small fixture or command sequence; identify synthetic versus actual provider input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include sanitized output and the contract assumption involved.
    validations:
      required: true
