[package]
name = "yellowstone-reconcile"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Conservative reconciliation of sealed Solana blocks across independent Yellowstone connections"
publish = false

[features]
default = []
upstream = ["dep:yellowstone-block-machine", "dep:solana-commitment-config"]
grpc = ["upstream", "yellowstone-block-machine/dragonsmouth", "dep:tokio", "dep:futures-util"]
simulation = ["grpc", "yellowstone-block-machine/test-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yellowstone-block-machine = { git = "https://github.com/rpcpool/yellowstone-block-machine", rev = "b828807d45522505cfdd6b4710d2287b29e5d99a", optional = true }
solana-commitment-config = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"], optional = true }
futures-util = { version = "0.3", optional = true }

[[bin]]
name = "yellowstone-replay"
path = "src/bin/replay.rs"

[[example]]
name = "upstream_bridge"
required-features = ["upstream"]

[[example]]
name = "two_providers"
required-features = ["grpc"]
