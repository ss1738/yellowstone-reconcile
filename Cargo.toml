[package]
name = "yellowstone-reconcile"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Conservative reconciliation of sealed Solana blocks across independent Yellowstone connections"
publish = false

[features]
default = []
upstream = ["dep:yellowstone-block-machine", "dep:solana-commitment-config"]
grpc = ["upstream", "yellowstone-block-machine/dragonsmouth", "dep:tokio", "dep:futures-util", "dep:bs58"]
simulation = ["grpc", "yellowstone-block-machine/test-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Experimental PR #22 pin, independently tested locally; see docs/DEPENDENCY-REVIEW.md.
yellowstone-block-machine = { git = "https://github.com/rpcpool/yellowstone-block-machine", rev = "0c732a049d6d18008a541f47b09ddb7b949cbb65", optional = true }
solana-commitment-config = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"], optional = true }
futures-util = { version = "0.3", optional = true }
bs58 = { version = "0.5", optional = true }

[[bin]]
name = "yellowstone-replay"
path = "src/bin/replay.rs"

[[example]]
name = "upstream_bridge"
required-features = ["upstream"]

[[example]]
name = "two_providers"
required-features = ["grpc"]

[[example]]
name = "dependency_probe"
required-features = ["simulation"]

[[example]]
name = "lag_memory"

[[example]]
name = "stall_budget"

[[example]]
name = "durable_sink"

[[example]]
name = "payload_variance"
