name: Hosted check (manual)
# The maintainer builds and tests Rust on their own machines. This GitHub-hosted workflow
# therefore runs ONLY when someone starts it by hand. It is not an automatic CI. An earlier
# push-triggered version of this file ran on 24 October 2026;
# this manual-only version has not been dispatched. To make it automatic, add push and pull_request
# triggers; that moves compilation to GitHub's machines, which is the maintainer's decision.
# Read-only token, no secrets: safe for untrusted code if it is enabled.
# The authoritative verification is scripts/verify.sh on a build machine (docs/VERIFICATION.md).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Test default features
        run: cargo test --locked --all-targets
      - name: Test sqlite sink
        run: cargo test --locked --features sqlite --all-targets
      - name: Test upstream bridge
        run: cargo test --locked --features upstream --all-targets
      - name: Clippy
        run: cargo clippy --locked --features sqlite,upstream --all-targets -- -D warnings
      - name: Fixtures must exit exactly as specified
        run: |
          cargo build --locked --release --bin yellowstone-replay
          bin=target/release/yellowstone-replay
          "$bin" fixtures/agreement.jsonl
          for fixture in conflict malformed; do
            status=0
            "$bin" "fixtures/$fixture.jsonl" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "$fixture returned $status, expected exactly 1" >&2
              exit 1
            fi
          done
