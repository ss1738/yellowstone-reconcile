name: Hosted check (manual)
# The owner's standing rule is that Rust builds and tests run on the owner's Mini machines.
# This GitHub-hosted workflow therefore runs ONLY when someone starts it by hand. It is not an
# automatic CI and it has never been run. To make it automatic, add push and pull_request
# triggers: that is an owner decision, because it compiles Rust on GitHub's machines.
# Read-only token, no secrets: safe for untrusted code if the owner does enable it.
# The authoritative verification is scripts/verify.sh on an owner Mini (see docs/RUNNER-SETUP.md).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Test default features
        run: cargo test --locked --all-targets
      - name: Test sqlite sink
        run: cargo test --locked --features sqlite --all-targets
      - name: Test upstream bridge
        run: cargo test --locked --features upstream --all-targets
      - name: Clippy
        run: cargo clippy --locked --features sqlite,upstream --all-targets -- -D warnings
      - name: Fixtures must exit exactly as specified
        run: |
          cargo build --locked --release --bin yellowstone-replay
          bin=target/release/yellowstone-replay
          "$bin" fixtures/agreement.jsonl
          for fixture in conflict malformed; do
            status=0
            "$bin" "fixtures/$fixture.jsonl" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "$fixture returned $status, expected exactly 1" >&2
              exit 1
            fi
          done
