name: Full verification on owner Mini
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Register this label only on the owner's Ironman Mini. Never on the cousin's Mini.
    runs-on: [self-hosted, macOS, ARM64, ironman]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner identity
        run: test "$(hostname | tr '[:upper:]' '[:lower:]' | cut -d. -f1)" = ironman
      - name: Verify all features, recovery, fixtures and examples
        run: bash scripts/verify.sh
